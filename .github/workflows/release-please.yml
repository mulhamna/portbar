name: Release

on:
  push:
    branches: [main]
  # Recovery path. release-please creates the GitHub release before it finishes,
  # so a transient API failure after that point leaves a published release whose
  # build job never ran — and re-running cannot help, because release-please then
  # sees the release already exists and reports nothing created. This lets the
  # build and publish steps be pointed at an existing tag on their own.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish, e.g. v3.3.0"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / tag
    # A manual run is for republishing a tag that already exists; it must not
    # open or merge anything.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-build:
    name: Build DMG + publish
    needs: release-please
    # `!cancelled()` is required: on a manual run release-please is skipped, and a
    # dependent job whose `needs` was skipped is skipped too unless the condition
    # tolerates it. A push whose release-please failed still evaluates to false
    # here, so a broken release never publishes by accident.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true') }}
    runs-on: macos-15
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build the tagged source, not whatever main has moved on to since.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Resolve version
        id: v
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build Release
        run: |
          xcodebuild \
            -project PortBar.xcodeproj \
            -scheme PortBar \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath build \
            build \
            MARKETING_VERSION="${{ steps.v.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package DMG
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          STAGE="$(mktemp -d)"
          cp -R build/Build/Products/Release/PortBar.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "PortBar" -srcfolder "$STAGE" -ov -format UDZO "PortBar-$VERSION.dmg"
          echo "SHA=$(shasum -a 256 "PortBar-$VERSION.dmg" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "PortBar-${{ steps.v.outputs.version }}.dmg" --clobber

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/mulhamna/homebrew-tap" tap
          cd tap
          sed -i '' -E "s/version \"[^\"]+\"/version \"$VERSION\"/" Casks/portbar.rb
          sed -i '' -E "s/sha256 \"[^\"]+\"/sha256 \"$SHA\"/" Casks/portbar.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A recovery run may find the cask already correct; committing nothing
          # is an error to git, but not to us.
          if git diff --quiet; then
            echo "Cask already at $VERSION — nothing to push."
          else
            git commit -am "chore: portbar $VERSION"
            git push
          fi
